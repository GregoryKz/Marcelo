<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Café Aurora · Pedidos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topo">
    <h1>☕ Café Aurora</h1>
    <p>Faça seu pedido e acompanhe a fila do balcão.</p>
  </header>

  <main class="conteudo">

    <!-- FORMULÁRIO DE PEDIDO -->
    <section class="painel">
      <h2>Novo pedido</h2>

      <!-- novalidate: quem valida é o nosso JavaScript -->
      <form id="form-pedido" novalidate>

        <label for="nome-cliente">Seu nome</label>
        <input type="text" id="nome-cliente" placeholder="Ex.: Ana">
        <span class="msg-erro" id="erro-nome"></span>

        <label for="item">Produto</label>
        <select id="item">
          <option value="">Escolha um produto</option>
          <option value="Café expresso"   data-preco="6">Café expresso — R$ 6,00</option>
          <option value="Cappuccino"      data-preco="9.5">Cappuccino — R$ 9,50</option>
          <option value="Pão de queijo"   data-preco="5">Pão de queijo — R$ 5,00</option>
          <option value="Bolo de cenoura" data-preco="8">Bolo de cenoura — R$ 8,00</option>
        </select>
        <span class="msg-erro" id="erro-item"></span>

        <label for="quantidade">Quantidade (1 a 10)</label>
        <input type="number" id="quantidade" value="1">
        <span class="msg-erro" id="erro-quantidade"></span>

        <label for="observacao">Observação (opcional)</label>
        <textarea id="observacao" maxlength="80" placeholder="Ex.: sem açúcar"></textarea>

        <button type="submit" id="btn-pedir">Fazer pedido</button>
      </form>
    </section>

    <!-- LISTA DE PEDIDOS -->
    <section class="painel">
      <h2>Pedidos <span class="badge" id="contador-pedidos">0</span></h2>

      <p id="lista-vazia">Nenhum pedido ainda.</p>

      <!-- Os cards dos pedidos serão CRIADOS pelo JavaScript aqui dentro -->
      <ul id="lista-pedidos"></ul>

      <div class="resumo">
        Total do caixa: <strong id="total-geral">R$ 0,00</strong>
      </div>
    </section>

  </main>

  <script src="Cafe_Aurora_script_gabarito.js"></script>
</body>
</html>
